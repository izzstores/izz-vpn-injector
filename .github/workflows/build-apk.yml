name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK (Stable 3.24.4)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.4'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Verify APK Generated
        run: |
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IZZ-TUNNELING-v1.0.1.apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "IZZ TUNNELING v1.0.1 (Release APK)"
          body: |
            ## ✦ IZZ TUNNELING v1.0.1 (Release APK) ✦
            
            Pembaruan Besar UI & Fitur Klasik (Classic HTTP Custom Style):
            - Tampilan solid tanpa gradasi warna (flat, non-AI aesthetic, classic green theme).
            - Metode SSH lengkap (Direct, HTTP Proxy, SSL/TLS Direct, SSL + Payload, WebSocket 80, WebSocket 443).
            - Form input bersih dengan placeholder contoh (host.com) tanpa bocor domain asli.
            - Fitur Save Config & Open Config (.izz / .hc) dengan proteksi Lock Config, Lock Account, Expiry Date, dan Password.
            - Modul V2Ray / Xray lengkap (VMess, VLess, Trojan, Shadowsocks) dengan fitur Auto-Parse Link (Paste Link).
            - Fitur Tools: Response Checker (Header Check), DNS Forwarder, IP Hunter, dan Tethering Hotspot Guide.
            - Cloud Tricks tanpa lock server (member bebas memakai server VPS milik sendiri).
            - Real-time Terminal Log Console.
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
