name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Next Version Tag
        id: version
        run: |
          # Get latest tag, auto-increment patch
          LATEST=$(git tag --sort=-v:refname | head -n 1 || echo "v1.0.0")
          if [ -z "$LATEST" ]; then LATEST="v1.0.0"; fi
          MAJOR=$(echo $LATEST | sed 's/v//' | cut -d. -f1)
          MINOR=$(echo $LATEST | sed 's/v//' | cut -d. -f2)
          PATCH=$(echo $LATEST | sed 's/v//' | cut -d. -f3)
          PATCH=$((PATCH + 1))
          TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Next version: $TAG (previous: $LATEST)"

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK (Stable 3.24.4)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.4'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Download official Xray-core Android binaries
        run: |
          mkdir -p android/app/src/main/assets/xray
          XRAY_VERSION="v26.10.29"

          download_xray() {
            abi="$1"
            asset="$2"
            out="$3"
            curl -fsSL --retry 3 "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/${asset}" -o /tmp/xray.zip
            unzip -oq /tmp/xray.zip xray -d /tmp/xray-extract
            mv /tmp/xray-extract/xray "$out"
            chmod 755 "$out"
            rm -rf /tmp/xray-extract /tmp/xray.zip
          }

          download_xray arm64 Xray-android-arm64-v8a.zip /tmp/xray-arm64
          download_xray x86_64 Xray-android-amd64.zip /tmp/xray-x86_64
          # Xray does not publish an Android ARM32 archive; its static Linux
          # ARMv7 binary is compatible with Android's 32-bit kernel/userspace.
          download_xray arm32 Xray-linux-arm32-v7a.zip /tmp/xray-arm32
          ls -lh /tmp/xray-arm*

      - name: Build ABI-specific Android APKs
        run: |
          set -e
          mkdir -p build/release-apks
          for spec in "armeabi-v7a:android-arm:xray-arm32" "arm64-v8a:android-arm64:xray-arm64" "x86_64:android-x64:xray-x86_64"; do
            IFS=: read -r abi target binary <<< "$spec"
            rm -rf android/app/src/main/assets/xray
            mkdir -p android/app/src/main/assets/xray
            cp "/tmp/$binary" "android/app/src/main/assets/xray/$abi"
            flutter build apk --release --target-platform "$target" --obfuscate --split-debug-info="build/debug-info-$abi" --tree-shake-icons
            mv build/app/outputs/flutter-apk/app-release.apk "build/release-apks/izz-tunnel-${abi}.apk"
          done
          ls -lh build/release-apks/

      - name: Verify APKs Generated
        run: |
          test -f build/release-apks/izz-tunnel-armeabi-v7a.apk
          test -f build/release-apks/izz-tunnel-arm64-v8a.apk
          test -f build/release-apks/izz-tunnel-x86_64.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Izz-Tunnel-${{ steps.version.outputs.tag }}-apks
          path: build/release-apks/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Izz Tunnel ${{ steps.version.outputs.tag }}"
          body: |
            ## Izz Tunnel ${{ steps.version.outputs.tag }} (Real Engine Edition)
            
            Pembaruan Besar & Fix Koneksi:
            - Engine Tunneling Nyata: sing-box native core + hev-socks5-tunnel terintegrasi langsung di APK.
            - Konfigurasi SSH Inject disamakan dengan Dark Tunnel:
              * Checkbox SSL/TLS (SNI) + input SNI Bug Host
              * Checkbox Payload + text area & tag shortcuts
              * Checkbox Remote Proxy + input Proxy IP:Port
              * Auto-set port cerdas (443 untuk SSL, 80 untuk Payload, 22 untuk Direct)
            - Menghapus TCP handshake blocker yang menyebabkan koneksi gagal di kartu seluler.
            - Kuota internet & aplikasi lain (WhatsApp, YouTube, Browser, Game) sekarang benar-benar ter-tunneling.
            - Monitoring traffic up/down live dari engine tunnel.
          files: build/release-apks/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
