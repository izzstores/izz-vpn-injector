name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Next Version Tag
        id: version
        run: |
          # Get latest tag, auto-increment patch
          LATEST=$(git tag --sort=-v:refname | head -n 1 || echo "v1.0.0")
          if [ -z "$LATEST" ]; then LATEST="v1.0.0"; fi
          MAJOR=$(echo $LATEST | sed 's/v//' | cut -d. -f1)
          MINOR=$(echo $LATEST | sed 's/v//' | cut -d. -f2)
          PATCH=$(echo $LATEST | sed 's/v//' | cut -d. -f3)
          PATCH=$((PATCH + 1))
          TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Next version: $TAG (previous: $LATEST)"

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK (Stable 3.24.4)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.4'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/debug-info --tree-shake-icons

      - name: Verify APK Generated
        run: |
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Izz-Tunnel-${{ steps.version.outputs.tag }}.apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Izz Tunnel ${{ steps.version.outputs.tag }}"
          body: |
            ## Izz Tunnel ${{ steps.version.outputs.tag }}
            
            Perbaikan:
            - Koneksi SSH/V2Ray: Validasi server asli (TCP handshake) sebelum status CONNECTED.
            - Server tidak valid / tidak aktif → langsung tampil ERROR, bukan fake connected.
            - Health check berkala setiap 15 detik, auto-disconnect jika server mati.
            - Tab "CLOUD TRICKS" diubah menjadi "TEMPLATE CONFIG".
            - Label "Open Config (.izz/.hc)" diubah menjadi "Open Config".
            - Bot admin: Langkah server/port dihapus dari flow tambah template.
            - Template config hanya menyimpan SNI, payload, protokol — server diisi member di app.
            - Error message dari VPN service ditampilkan di log dan SnackBar.
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
