name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Next Version Tag
        id: version
        run: |
          # Get latest tag, auto-increment patch
          LATEST=$(git tag --sort=-v:refname | head -n 1 || echo "v1.0.0")
          if [ -z "$LATEST" ]; then LATEST="v1.0.0"; fi
          MAJOR=$(echo $LATEST | sed 's/v//' | cut -d. -f1)
          MINOR=$(echo $LATEST | sed 's/v//' | cut -d. -f2)
          PATCH=$(echo $LATEST | sed 's/v//' | cut -d. -f3)
          PATCH=$((PATCH + 1))
          TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Next version: $TAG (previous: $LATEST)"

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK (Stable 3.24.4)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.4'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Download official Xray-core Android binaries
        run: |
          rm -rf android/app/src/main/assets/xray
          mkdir -p android/app/src/main/assets/xray
          XRAY_VERSION="v26.10.29"

          download_xray() {
            abi="$1"
            asset="$2"
            out="$3"
            curl -fsSL --retry 3 "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/${asset}" -o /tmp/xray.zip
            unzip -oq /tmp/xray.zip xray -d /tmp/xray-extract
            mv /tmp/xray-extract/xray "$out"
            chmod 755 "$out"
            rm -rf /tmp/xray-extract /tmp/xray.zip
          }

          # Android packages exist for arm64 and amd64. Static Linux builds
          # provide the 32-bit ARM and x86 variants for universal APK use.
          download_xray arm64 Xray-android-arm64-v8a.zip /tmp/xray-arm64
          download_xray x86_64 Xray-android-amd64.zip /tmp/xray-x86_64
          download_xray arm32 Xray-linux-arm32-v7a.zip /tmp/xray-arm32
          download_xray x86 Xray-linux-32.zip /tmp/xray-x86
          cp /tmp/xray-arm64 android/app/src/main/assets/xray/arm64-v8a
          cp /tmp/xray-arm32 android/app/src/main/assets/xray/armeabi-v7a
          cp /tmp/xray-x86_64 android/app/src/main/assets/xray/x86_64
          cp /tmp/xray-x86 android/app/src/main/assets/xray/x86
          ls -lh android/app/src/main/assets/xray/*

      - name: Build Universal Android APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/debug-info --tree-shake-icons

      - name: Verify Universal APK
        run: |
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Izz-Tunnel-${{ steps.version.outputs.tag }}-universal.apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Izz Tunnel ${{ steps.version.outputs.tag }}"
          body: |
            ## Izz Tunnel ${{ steps.version.outputs.tag }} (Real Engine Edition)
            
            Pembaruan Besar & Fix Koneksi:
            - Engine Tunneling Nyata: sing-box native core + hev-socks5-tunnel terintegrasi langsung di APK.
            - Konfigurasi SSH Inject disamakan dengan Dark Tunnel:
              * Checkbox SSL/TLS (SNI) + input SNI Bug Host
              * Checkbox Payload + text area & tag shortcuts
              * Checkbox Remote Proxy + input Proxy IP:Port
              * Auto-set port cerdas (443 untuk SSL, 80 untuk Payload, 22 untuk Direct)
            - Menghapus TCP handshake blocker yang menyebabkan koneksi gagal di kartu seluler.
            - Kuota internet & aplikasi lain (WhatsApp, YouTube, Browser, Game) sekarang benar-benar ter-tunneling.
            - Monitoring traffic up/down live dari engine tunnel.
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
