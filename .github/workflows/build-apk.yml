name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Next Version Tag
        id: version
        run: |
          # Get latest tag, auto-increment patch
          LATEST=$(git tag --sort=-v:refname | head -n 1 || echo "v1.0.0")
          if [ -z "$LATEST" ]; then LATEST="v1.0.0"; fi
          MAJOR=$(echo $LATEST | sed 's/v//' | cut -d. -f1)
          MINOR=$(echo $LATEST | sed 's/v//' | cut -d. -f2)
          PATCH=$(echo $LATEST | sed 's/v//' | cut -d. -f3)
          PATCH=$((PATCH + 1))
          TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Next version: $TAG (previous: $LATEST)"

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK (Stable 3.24.4)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.4'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Download sing-box Core Binaries
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          mkdir -p android/app/src/main/jniLibs/x86_64

          echo "Downloading sing-box arm64..."
          curl -s -L --retry 3 "https://github.com/SagerNet/sing-box/releases/download/v1.10.1/sing-box-1.10.1-android-arm64.tar.gz" | tar -xz -C /tmp/
          mv /tmp/sing-box-1.10.1-android-arm64/sing-box android/app/src/main/jniLibs/arm64-v8a/libsing-box.so

          echo "Downloading sing-box armv7..."
          curl -s -L --retry 3 "https://github.com/SagerNet/sing-box/releases/download/v1.10.1/sing-box-1.10.1-android-armv7.tar.gz" | tar -xz -C /tmp/
          mv /tmp/sing-box-1.10.1-android-armv7/sing-box android/app/src/main/jniLibs/armeabi-v7a/libsing-box.so

          echo "Downloading sing-box amd64..."
          curl -s -L --retry 3 "https://github.com/SagerNet/sing-box/releases/download/v1.10.1/sing-box-1.10.1-android-amd64.tar.gz" | tar -xz -C /tmp/
          mv /tmp/sing-box-1.10.1-android-amd64/sing-box android/app/src/main/jniLibs/x86_64/libsing-box.so

          chmod 755 android/app/src/main/jniLibs/*/libsing-box.so
          ls -lh android/app/src/main/jniLibs/*/libsing-box.so

      - name: Build Android Release APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/debug-info --tree-shake-icons

      - name: Verify APK Generated
        run: |
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Izz-Tunnel-${{ steps.version.outputs.tag }}.apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Izz Tunnel ${{ steps.version.outputs.tag }}"
          body: |
            ## Izz Tunnel ${{ steps.version.outputs.tag }} (Real Engine Edition)
            
            Pembaruan Besar & Fix Koneksi:
            - Engine Tunneling Nyata: sing-box native core + hev-socks5-tunnel terintegrasi langsung di APK.
            - Konfigurasi SSH Inject disamakan dengan Dark Tunnel:
              * Checkbox SSL/TLS (SNI) + input SNI Bug Host
              * Checkbox Payload + text area & tag shortcuts
              * Checkbox Remote Proxy + input Proxy IP:Port
              * Auto-set port cerdas (443 untuk SSL, 80 untuk Payload, 22 untuk Direct)
            - Menghapus TCP handshake blocker yang menyebabkan koneksi gagal di kartu seluler.
            - Kuota internet & aplikasi lain (WhatsApp, YouTube, Browser, Game) sekarang benar-benar ter-tunneling.
            - Monitoring traffic up/down live dari engine tunnel.
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
