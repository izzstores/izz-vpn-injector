name: Experimental Legacy HEV Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-hev:
    name: Build experimental Android 8/9 HEV APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.4'
          channel: stable
          cache: true

      - name: Install Android 35 and NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          find "$ANDROID_HOME" -type f \( -name sdkmanager -o -name ndk-build \) -print 2>/dev/null | head -20
          SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          test -x "$ANDROID_HOME/ndk/27.2.12479018/ndk-build" || test -x "$ANDROID_HOME/ndk-bundle/ndk-build"

      - name: Build HEV from source with API 26
        run: |
          rm -rf /tmp/hev /tmp/hev-aar
          git clone --depth 1 --recurse-submodules https://github.com/heiher/hev-socks5-tunnel.git /tmp/hev
          sed -i 's/^APP_PLATFORM := .*/APP_PLATFORM := android-26/' /tmp/hev/Application.mk
          sed -i 's/^APP_ABI := .*/APP_ABI := armeabi-v7a arm64-v8a/' /tmp/hev/Application.mk
          "$ANDROID_HOME/ndk/27.2.12479018/ndk-build" -C /tmp/hev NDK_PROJECT_PATH=/tmp/hev APP_BUILD_SCRIPT=/tmp/hev/Android.mk NDK_APPLICATION_MK=/tmp/hev/Application.mk
          test -s /tmp/hev/libs/armeabi-v7a/libhev-socks5-tunnel.so
          test -s /tmp/hev/libs/arm64-v8a/libhev-socks5-tunnel.so
          mkdir -p /tmp/hev-aar/jni/armeabi-v7a /tmp/hev-aar/jni/arm64-v8a
          unzip -p android/app/libs/hev-socks5-tunnel.aar classes.jar > /tmp/hev-aar/classes.jar
          unzip -p android/app/libs/hev-socks5-tunnel.aar proguard.txt > /tmp/hev-aar/proguard.txt
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="hev.socks5.tunnel"><uses-sdk android:minSdkVersion="24"/></manifest>' > /tmp/hev-aar/AndroidManifest.xml
          cp /tmp/hev/libs/armeabi-v7a/libhev-socks5-tunnel.so /tmp/hev-aar/jni/armeabi-v7a/
          cp /tmp/hev/libs/arm64-v8a/libhev-socks5-tunnel.so /tmp/hev-aar/jni/arm64-v8a/
          (cd /tmp/hev-aar && zip -qr "$GITHUB_WORKSPACE/android/app/libs/hev-socks5-tunnel-legacy.aar" .)
          unzip -p android/app/libs/hev-socks5-tunnel-legacy.aar AndroidManifest.xml
          file /tmp/hev/libs/*/libhev-socks5-tunnel.so

      - name: Use experimental AAR and enable legacy path for test only
        run: |
          mv android/app/libs/hev-socks5-tunnel.aar android/app/libs/hev-socks5-tunnel-upstream.aar
          mv android/app/libs/hev-socks5-tunnel-legacy.aar android/app/libs/hev-socks5-tunnel.aar
          sed -i 's/if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) {/if (false) {/' android/app/src/main/kotlin/com/izz/tunneling/injector/IzzVpnService.kt
          flutter pub get

      - name: Build experimental APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/debug-info --tree-shake-icons

      - name: Verify and upload experimental APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          "$AAPT" dump badging build/app/outputs/flutter-apk/app-release.apk | grep "targetSdkVersion:'35'"
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep -E 'lib/(armeabi-v7a|arm64-v8a)/libhev-socks5-tunnel.so'

      - name: Upload experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: Izz-Tunnel-experimental-legacy-hev
          path: build/app/outputs/flutter-apk/app-release.apk
